### flare · 结构化 JSON 输出
### 判据：GOES XRS-B peak flux: C 1e-6 to 1e-5, M 1e-5 to 1e-4, X above 1e-4

### model
model_name_or_path: C:/vlmdisaster/models/Qwen3-VL-4B/models/Qwen--Qwen3-VL-4B-Instruct/snapshots/master
quantization_bit: 4
quantization_method: bnb
image_max_pixels: 131072
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 4
lora_dropout: 0.05
lora_target: q_proj,v_proj

### dataset
dataset_dir: C:/vlmdisaster/LLaMA-Factory/data
dataset: disaster_flare_json
eval_dataset: disaster_flare_json_val
template: qwen3_vl_nothink
cutoff_len: 512
preprocessing_num_workers: 2
dataloader_num_workers: 0

### output
output_dir: C:/vlmdisaster/outputs/qwen3vl-lora-flare-json
logging_steps: 20
save_steps: 200
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 4.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
