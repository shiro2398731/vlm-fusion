# 三路特征融合配置示例：一个元素一份
# 默认测试模型：视觉 ResNet50 探针 + 语义 CLIP 探针（可在注册表里换成 DINOv2 等）
snow_fsc:
  physical:
    source: raw_workflow
    renderer: snow_fsc

  # 数值支路：物理统计量（渲染前算出，客观）
  numeric:
    extractor: numeric
    fields: [mean_fsc]
    scale:
      mean_fsc: [0.0, 1.0]

  # 视觉支路：冻结 CNN（默认 ResNet50 探针）
  visual:
    extractor: resnet_probe
    probe_path: outputs/probes/snow_fsc_resnet_probe.joblib
    # 备选：none | resnet50 | dinov2_probe | dinov2_small

  # 语义支路：冻结 CLIP（默认测试模型）
  semantic:
    extractor: clip_probe
    probe_path: outputs/probes/snow_fsc_clip_probe.joblib
    # 备选：none | clip_vit_b32 | clip_vit_l14

  fusion:
    mode: [text, image]
    include_numeric: true
    include_visual: true
    include_semantic: true
    include_vectors: true     # 三路特征向量摘要一起进输入
    image_layout: side       # side | overlay
    visual_weight: 0.35
    max_text_lines: 10

  eval:
    backend: local           # local | api
    model: qwen3-vl-4b
