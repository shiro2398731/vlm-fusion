# 全部元素默认配置（由脚本生成）
# 语义默认 CLIP 探针，视觉默认 ResNet50 探针，数值现算。
# 逐元素开关见 fusion_selected.yaml；本文件用于完整链路默认跑通。

bloom_chla:
  numeric: {extractor: numeric}
  visual: {extractor: resnet_probe, probe_path: C:/vlm-fusion/outputs/probes/bloom_chla_resnet_probe.joblib}
  semantic: {extractor: clip_probe, probe_path: C:/vlm-fusion/outputs/probes/bloom_chla_clip_probe.joblib}
  fusion:
    mode: [text, image]
    include_numeric: true
    include_visual: true
    include_semantic: true
    include_vectors: true
  eval: {backend: local}

